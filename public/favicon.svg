<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle — deep maroon -->
  <circle cx="32" cy="32" r="31" fill="#7B1D2E"/>
  <!-- Outer antique-gold ring -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#E8B04A" stroke-width="1.5"/>
  <!-- Inner subtle ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#E8B04A" stroke-width="0.5" opacity="0.5"/>

  <!-- Ghungroo bells row (3 bells at bottom) -->
  <ellipse cx="23" cy="51" rx="3.5" ry="2.5" fill="#E8B04A"/>
  <ellipse cx="32" cy="52" rx="3.5" ry="2.5" fill="#FF8A1F"/>
  <ellipse cx="41" cy="51" rx="3.5" ry="2.5" fill="#E8B04A"/>
  <!-- Bell slits -->
  <line x1="23" y1="51" x2="23" y2="53" stroke="#7B1D2E" stroke-width="0.8"/>
  <line x1="32" y1="52" x2="32" y2="54" stroke="#7B1D2E" stroke-width="0.8"/>
  <line x1="41" y1="51" x2="41" y2="53" stroke="#7B1D2E" stroke-width="0.8"/>

  <!-- Stylised foot / charan silhouette — white -->
  <path d="M18 44 Q18 34 22 28 Q26 24 30 26 Q34 24 38 28 Q42 34 42 44 Q38 48 32 48 Q26 48 18 44Z"
        fill="#FFF8EE" opacity="0.92"/>
  <!-- Toe bumps -->
  <ellipse cx="22" cy="44.5" rx="2" ry="1.5" fill="#FFF8EE"/>
  <ellipse cx="26" cy="46"   rx="2" ry="1.5" fill="#FFF8EE"/>
  <ellipse cx="31" cy="47"   rx="2" ry="1.5" fill="#FFF8EE"/>
  <ellipse cx="36" cy="46"   rx="2" ry="1.5" fill="#FFF8EE"/>
  <ellipse cx="40" cy="44"   rx="2" ry="1.5" fill="#FFF8EE"/>

  <!-- Anklet / payal curve -->
  <path d="M20 40 Q32 43 44 40" fill="none" stroke="#E8B04A" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Alta red dot on foot -->
  <circle cx="31" cy="37" r="2.2" fill="#D9381E"/>
  <circle cx="31" cy="37" r="3.5" fill="none" stroke="#D9381E" stroke-width="0.6" opacity="0.5"/>

  <!-- OM symbol at top -->
  <text x="32" y="22" font-family="serif" font-size="14" text-anchor="middle"
        fill="#E8B04A" font-weight="bold">ॐ</text>
</svg>
